name: Test and deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The devbox's own runner. Only pushes to main reach it, never fork PRs.
    runs-on: [self-hosted, discord-bot]
    concurrency: deploy
    env:
      BOT_ENV_FILE: /home/alwinihza/project/discord-bot/.env
    steps:
      - uses: actions/checkout@v4

      - name: Back up the database before deploying
        run: |
          backups="$HOME/backups/discord-bot"
          mkdir -p "$backups"
          if [ -n "$(docker compose --env-file "$BOT_ENV_FILE" ps -q discord-bot)" ]; then
            docker compose --env-file "$BOT_ENV_FILE" exec -T discord-bot sqlite3 /data/karaoke.db ".backup /tmp/snap.db"
            docker compose --env-file "$BOT_ENV_FILE" cp discord-bot:/tmp/snap.db "$backups/karaoke-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}.db"
            docker compose --env-file "$BOT_ENV_FILE" exec -T discord-bot rm /tmp/snap.db
          fi
          ls -1t "$backups"/karaoke-*.db 2>/dev/null | tail -n +31 | xargs -r rm --

      - name: Deploy
        run: docker compose --env-file "$BOT_ENV_FILE" up -d --build --remove-orphans

      - name: Wait for the bot to log in
        run: timeout 60 sh -c 'until docker compose --env-file "$BOT_ENV_FILE" logs discord-bot | grep -q "Bot is ready"; do sleep 2; done'
