name: Test and deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The devbox's own runner. Only pushes to main reach it, never fork PRs.
    runs-on: [self-hosted, discord-bot]
    concurrency: deploy
    env:
      BOT_ENV_FILE: /home/alwinihza/project/discord-bot/.env
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: docker compose --env-file "$BOT_ENV_FILE" up -d --build --remove-orphans

      - name: Wait for the bot to log in
        run: timeout 60 sh -c 'until docker compose --env-file "$BOT_ENV_FILE" logs discord-bot | grep -q "Bot is ready"; do sleep 2; done'
