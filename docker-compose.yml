name: discord-bot

services:
  discord-bot:
    build: .
    environment:
      TOKEN: ${TOKEN:?set TOKEN in .env}
      DATABASE_PATH: /data/karaoke.db
      ANNOUNCE_CHANNEL_ID: ${ANNOUNCE_CHANNEL_ID:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SITE_ADMIN_URL: ${SITE_ADMIN_URL:-}
      SITE_ADMIN_SECRET: ${SITE_ADMIN_SECRET:-}
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-}
      COMMISSIONS_CHANNEL_ID: ${COMMISSIONS_CHANNEL_ID:-}
      COMMISSION_MANAGER_IDS: ${COMMISSION_MANAGER_IDS:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      LIVE_CHANNEL_ID: ${LIVE_CHANNEL_ID:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      LIVE_PING_ROLE_ID: ${LIVE_PING_ROLE_ID:-}
    ports:
      - "${WEBHOOK_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - botdata:/data
    restart: always

volumes:
  botdata:
