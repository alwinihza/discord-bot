services:
  discord-bot:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      - TOKEN=${TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
    restart: always

networks:
  mynet:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: "172.28.0.0/16"
        - subnet: "fd00:dead:beef::/64"
