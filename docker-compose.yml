name: discord-bot

services:
  discord-bot:
    build: .
    environment:
      TOKEN: ${TOKEN:?set TOKEN in .env}
      DATABASE_PATH: /data/karaoke.db
      ANNOUNCE_CHANNEL_ID: ${ANNOUNCE_CHANNEL_ID:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - botdata:/data
    restart: always

volumes:
  botdata:
